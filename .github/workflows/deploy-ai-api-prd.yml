name: Deploy AI API (Prd)

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/safehome-ai-api
  DEPLOY_PATH: /home/woopi/project/safehome/ai-api-prd

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # 로컬과 같은 파일을 실행한다. 명령이 다르면 로컬 통과가 CI 통과를 뜻하지 않는다.
      - name: Run tests
        run: bash scripts/verify.sh

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prd
            type=semver,pattern={{version}}

      # 올리기 전에 이미지를 실제로 띄워, 배포 구성의 헬스 체크를 컨테이너 안에서 돌린다.
      # 테스트는 이미지를 보지 않는다 — 모듈이 빠지거나 헬스 체크 도구가 없으면 여기서 걸린다.
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: safehome-ai-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: python3 scripts/smoke_image.py safehome-ai-api:smoke

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Prd Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: prd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRD_SSH_HOST }}
          username: ${{ secrets.PRD_SSH_USER }}
          key: ${{ secrets.PRD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PRD_SSH_PORT || 22 }}
          source: "docker/prd/docker-compose.yml"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRD_SSH_HOST }}
          username: ${{ secrets.PRD_SSH_USER }}
          key: ${{ secrets.PRD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PRD_SSH_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose --env-file /home/woopi/project/safehome/env/.env_ai_api_prd pull safehome-ai-api
            docker compose --env-file /home/woopi/project/safehome/env/.env_ai_api_prd up -d --no-deps safehome-ai-api

            # 기동 확인 — 배포 성공이 기동 성공을 뜻하도록 헬스 체크를 기다린다.
            # 컨테이너를 띄우라는 지시만으로 끝내면 기동 실패가 초록으로 지나간다.
            CONTAINER=safehome-ai-api-prd
            for _ in $(seq 1 36); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo missing)
              case "$STATUS" in
                healthy)  echo "기동 확인: healthy"; break ;;
                starting) sleep 5 ;;
                *)        echo "기동 실패 — 상태: $STATUS"
                          docker logs --tail 80 "$CONTAINER" 2>&1 || true
                          exit 1 ;;
              esac
            done
            if [ "$STATUS" != "healthy" ]; then
              echo "기동 확인 시간 초과 — 마지막 상태: $STATUS"
              docker logs --tail 80 "$CONTAINER" 2>&1 || true
              exit 1
            fi
            docker image prune -f
