services:
  safehome-ai-api:
    image: ghcr.io/${GITHUB_OWNER}/safehome-ai-api:prd
    container_name: safehome-ai-api-prd
    env_file: /home/woopi/project/safehome/env/.env_ai_api_prd
    environment:
      APP_ENV: prd
      TZ: Asia/Seoul
    volumes:
      - chroma-data:/app/chroma_db
      - logs-data:/app/logs
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - safehome-net
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  chroma-data:
  logs-data:

networks:
  safehome-net:
    external: true
